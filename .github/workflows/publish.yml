name: Publish VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  verify-oidc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Marketplace Trusted Publishing
        uses: actions/github-script@v8
        with:
          script: |
            const { publisher } = require('./package.json');
            const token = await core.getIDToken('marketplace.visualstudio.com');
            const response = await fetch('https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1', {
              method: 'POST',
              headers: {
                Accept: 'application/json',
                Authorization: `FederatedToken ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'vsce',
              },
              body: JSON.stringify({ publisherName: publisher }),
              redirect: 'error',
              signal: AbortSignal.timeout(30_000),
            });
            if (!response.ok) {
              throw new Error(`Marketplace rejected OIDC for ${publisher} (HTTP ${response.status}).`);
            }
            const { credential } = await response.json();
            if (typeof credential !== 'string' || !credential) {
              throw new Error(`Marketplace returned no publishing credential for ${publisher}.`);
            }
            core.info(`Marketplace OIDC exchange succeeded for ${publisher}.`);

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: npm test

      - name: Package extension
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          vsix="${name}-${version}.vsix"
          npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out "$vsix"
          echo "VSIX_PATH=$vsix" >> "$GITHUB_ENV"

      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX_PATH" --skip-duplicate

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" "$VSIX_PATH" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
